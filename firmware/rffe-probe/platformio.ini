; PlatformIO project for the W2R Open RFFE probe firmware.
;
; This is a clean-room, open-source replacement for the proprietary
; rffe-esp32-1.0.1.bin that shipped with W2R Solutions. It implements the same
; host-facing command (the literal "way2_rffe_") plus a documented line protocol,
; and bit-bangs a MIPI RFFE master to enumerate devices on a phone's RF front end.
;
; Build:   pio run            (firmware.bin lands in .pio/build/esp32dev/)
; Flash:   pio run -t upload
; Or use the app's "Update Probe Firmware" button / esptool at 0x10000.
;
; Pin defaults are overridable from the build environment, e.g.:
;   pio run -DRFFE_SCLK_PIN=19 -DRFFE_SDATA_PIN=18

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DW2R_RFFE_VERSION=\"1.0.0\"
    -DRFFE_SCLK_PIN=19
    -DRFFE_SDATA_PIN=18
    -DRFFE_VIO_PIN=-1
    -DRFFE_ADC_PIN=-1
